<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Colours the phone's browser bar to match the app. -->
  <meta name="theme-color" content="#f5ede3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1410" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Kindstart: success is a direction, not a destination. Understand yourself. Set your goals.">
  <title>Kindstart</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Always one tap away: crisis lines. -->
  <button type="button" class="sos" data-go="crisis" aria-label="SOS: crisis lines">SOS</button>

  <!-- Shown only when a content file has a mistake. -->
  <p id="content-error" class="content-error" role="alert" hidden></p>

  <!-- Reminders appear here, at the top of the screen, until they're closed. -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <main>
    <!-- Today: the main screen. -->
    <section id="page-today" data-page="today">
      <h1 class="sr-only">Kindstart</h1>
      <div id="today-top" class="today-top"></div>
      <div id="moment-slot"></div>
      <div id="task-area"></div>
      <div id="timeline-body"></div>
      <button type="button" id="add-task" class="fab" aria-label="Add a task">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </section>

    <!-- Every other page: a short title, and a body that JavaScript draws. -->
    <section id="page-calendar" data-page="calendar" hidden><h1 class="page-title">Calendar</h1><div class="page-body"></div></section>
    <section id="page-focus" data-page="focus" hidden><h1 class="page-title">Focus</h1><div class="page-body"></div></section>
    <section id="page-help" data-page="help" hidden><h1 class="page-title">Help</h1><div class="page-body"></div></section>
    <section id="page-test" data-page="test" hidden><h1 class="page-title">About you</h1><div class="page-body"></div></section>
    <section id="page-crisis" data-page="crisis" hidden><h1 class="page-title">Crisis</h1><div class="page-body"></div></section>
    <section id="page-goals" data-page="goals" hidden><h1 class="page-title">Goals</h1><div class="page-body"></div></section>
    <section id="page-notes" data-page="notes" hidden><h1 class="page-title">Notes</h1><div class="page-body"></div></section>
    <section id="page-sleep" data-page="sleep" hidden><h1 class="page-title">Sleep</h1><div class="page-body"></div></section>
    <section id="page-tips" data-page="tips" hidden><h1 class="page-title">Tips</h1><div class="page-body"></div></section>
    <section id="page-saved" data-page="saved" hidden><h1 class="page-title">Saved</h1><div class="page-body"></div></section>
    <section id="page-me" data-page="me" hidden><h1 class="page-title">Me</h1><div class="page-body"></div></section>

    <!-- About what runs inside the app, not how the code was written (see README). -->
    <details class="plaque">
      <summary>No AI inside</summary>
      <p>The app follows plain rules. Nothing you write goes to an AI.</p>
    </details>
  </main>

  <!-- ⋯ : the less-used pages, shown only when asked for. -->
  <div id="more-menu" class="more-menu" hidden>
    <button type="button" data-go="goals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Goals</button>
    <button type="button" data-go="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Notes</button>
    <button type="button" data-go="sleep"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sleep</button>
    <button type="button" data-go="tips"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.1 2V17h5v-1.2c0-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg>Tips</button>
    <button type="button" data-go="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-5-4-5 4z"/></svg>Saved</button>
    <button type="button" data-go="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Me</button>
  </div>

  <!-- The bottom bar: four pages and ⋯. -->
  <nav class="tabs" aria-label="Pages">
    <button type="button" data-go="today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></button>
    <button type="button" data-go="calendar" data-tab="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
    <button type="button" data-go="focus" data-tab="focus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span>Focus</span></button>
    <button type="button" data-go="help" data-tab="help"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span>Help</span></button>
    <button type="button" data-more data-tab="more" aria-expanded="false" aria-controls="more-menu" aria-label="More pages"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span>More</span></button>
  </nav>
</body>
</html>
